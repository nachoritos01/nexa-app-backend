##
# Local simulation of the Railway deploy pipeline.
# Usage:
#   docker compose build   → builds the image (same as Railway Build step)
#   docker compose up      → runs entrypoint (migrate, seed, cache, serve)
#   docker compose down -v → tear down everything
#
# This mirrors: Dockerfile (multi-stage) + scripts/docker-entrypoint.sh
# All values are read from .env (with sensible defaults).
##

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    environment:
      APP_NAME: ${APP_NAME:-SaaSTemplate}
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8000}
      PORT: "${APP_PORT:-8000}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-saas_template}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-sync}
      CACHE_STORE: ${CACHE_STORE:-database}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      LOG_CHANNEL: stderr
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-public}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-admin@example.com}
      BUSINESS_NAME: ${BUSINESS_NAME:-MySaaS}
      BUSINESS_CURRENCY: ${BUSINESS_CURRENCY:-USD}
      STRIPE_KEY: ${STRIPE_KEY:-}
      STRIPE_SECRET: ${STRIPE_SECRET:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "echo file_get_contents('http://localhost:${APP_PORT:-8000}/');"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-saas_template}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
